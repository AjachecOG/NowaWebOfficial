# Netlify Forms: markup lives in ContactForm.astro (data-netlify, honeypot, form-name).
# Forms detected from built HTML: "kontakt" (/kontakt/) and "kontakt-home" (/).
# Spam filtering: Netlify automatic filters (Akismet) plus the form honeypot.
# Ops (dashboard): keep form detection enabled and configure notification email.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'none';"
